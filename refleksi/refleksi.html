<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Refleksi | Syira</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#050b14', // Very dark navy/black
                            800: '#0a1426', // Deep navy
                            700: '#112240', // Lighter navy for borders
                        },
                        neon: {
                            blue: '#4facfe',
                            cyan: '#00f2fe'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050b14; }
        ::-webkit-scrollbar-thumb { background: #112240; border-radius: 10px; }
        .bg-glow {
            position: fixed; top: 50%; left: 50%; width: 100vw; height: 100vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 50% 50%, rgba(17, 34, 64, 0.5), rgba(5, 11, 20, 1) 70%);
            z-index: -2;
        }
        .ambient-light {
            position: fixed; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.05), transparent 70%);
            z-index: -1; animation: float 15s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translate(-10%, -10%) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.2); }
        }

        /* Neon Focus Glow */
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.4), inset 0 0 10px rgba(79, 172, 254, 0.1);
            border-color: #4facfe;
        }

        /* Slide & Fade In Animation untuk Entry Baru */
        .entry-animate {
            animation: slideFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(10, 20, 38, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-navy-900 text-gray-300 font-sans antialiased min-h-screen relative overflow-x-hidden">

    <div class="bg-glow"></div>
    <div class="ambient-light" style="top: -10%; left: -10%;"></div>
    <div class="ambient-light" style="bottom: -10%; right: -10%; animation-delay: -5s;"></div>

    <div class="max-w-4xl mx-auto p-6 md:p-12 relative z-10">
        <header class="mb-12 text-center">
            <h1 class="text-4xl md:text-5xl font-serif text-white mb-3 tracking-wide">RUANG REFLEKSI</h1>
            <p class="text-gray-400 text-sm md:text-base font-light tracking-widest uppercase">Growth starts when you are honest with yourself</p>
        </header>

        <main class="glass-panel p-8 rounded-2xl shadow-2xl mb-16 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-neon-blue to-transparent opacity-30"></div>
            
            <form id="reflectionForm" class="space-y-8">
                <div>
                    <label class="flex items-center gap-2 text-sm font-semibold text-neon-blue mb-3 uppercase tracking-wider" for="feelings">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        Perasaanku
                    </label>
                    <textarea id="feelings" rows="2" required
                        class="input-glow w-full bg-navy-800/80 border border-navy-700 rounded-xl p-4 text-gray-200 focus:outline-none transition-all duration-300 resize-none"
                        placeholder="Apa yang mendominasi pikiranmu hari ini?"></textarea>
                </div>

        <div id="tab-mood" class="tab-content">
            <div class="glass-panel p-8 rounded-2xl text-center space-y-6">
                <h2 class="text-xl font-serif text-white">Pilih Suasana Hati (Mood) Kamu Hari Ini</h2>
                <p class="text-gray-400 text-xs">Bagikan kondisimu agar pasangan tahu apa yang sedang kamu rasakan.</p>
                <div class="flex justify-center gap-4 flex-wrap pt-4">
                    <button onclick="setMood('Bahagia ☀️', 'from-amber-400 to-orange-500')" class="glass-panel px-5 py-3 rounded-xl hover:border-amber-400 transition-all text-sm">☀️ Bahagia</button>
                    <button onclick="setMood('Lelah 🌧️', 'from-blue-400 to-indigo-600')" class="glass-panel px-5 py-3 rounded-xl hover:border-blue-400 transition-all text-sm">🌧️ Lelah</button>
                    <button onclick="setMood('Rindu 🌙', 'from-purple-400 to-pink-500')" class="glass-panel px-5 py-3 rounded-xl hover:border-purple-400 transition-all text-sm">🌙 Rindu</button>
                    <button onclick="setMood('Stres ⚡', 'from-red-400 to-rose-600')" class="glass-panel px-5 py-3 rounded-xl hover:border-red-400 transition-all text-sm">⚡ Stres</button>
                </div>
                <div id="moodStatusDisplay" class="mt-8 p-4 rounded-xl bg-navy-800/80 border border-navy-700 text-sm text-gray-300">
                    Status Mood Terakhir: <span id="currentMoodText" class="text-neon-blue font-semibold">Belum dipilih</span>
                </div>
            </div>
        </div>

        <div id="tab-hug" class="tab-content">
            <div class="glass-panel p-10 rounded-2xl text-center space-y-6">
                <div class="w-20 h-20 bg-neon-blue/10 border border-neon-blue/30 rounded-full flex items-center justify-center mx-auto text-3xl animate-bounce">
                    🤗
                </div>

                <div class="text-center pt-2">
                    <button type="submit" 
                        class="group relative inline-flex items-center justify-center px-8 py-3 text-sm font-bold text-white uppercase tracking-widest transition-all duration-300 bg-gradient-to-r from-cyan-600 to-blue-600 rounded-full hover:from-cyan-500 hover:to-blue-500 overflow-hidden shadow-[0_0_20px_rgba(79,172,254,0.3)] hover:shadow-[0_0_30px_rgba(79,172,254,0.6)]">
                        <span class="absolute w-0 h-0 transition-all duration-500 ease-out bg-white rounded-full group-hover:w-56 group-hover:h-56 opacity-10"></span>
                        <span class="relative">Simpan Jurnal Hari Ini</span>
                    </button>
                </div>
            </form>
        </main>

        <section>
            <h2 class="text-center text-sm font-bold text-gray-400 uppercase tracking-[0.3em] mb-8 relative">
                <span class="bg-navy-900 px-4 relative z-10">Jejak Langkah (History)</span>
                <div class="absolute top-1/2 left-0 w-full h-[1px] bg-navy-700 -z-0"></div>
            </h2>
            
            <div id="journalEntries" class="space-y-6">
                </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('reflectionForm');
            const entriesContainer = document.getElementById('journalEntries');

            // Load data dari LocalStorage
            let journals = JSON.parse(localStorage.getItem('syiraJournalsAesthetic')) || [];

            // Fungsi render satu entry
            const createEntryHTML = (entry, animate = false) => {
                const card = document.createElement('div');
                card.className = `glass-panel p-6 md:p-8 rounded-2xl border-l-4 border-l-neon-blue hover:border-l-neon-cyan transition-colors duration-300 ${animate ? 'entry-animate' : ''}`;
                
                card.innerHTML = `
                    <div class="text-xs text-gray-500 mb-5 font-mono tracking-wider">${entry.date}</div>
                    <div class="space-y-5">
                        <div>
                            <h3 class="text-neon-blue text-xs font-bold uppercase tracking-widest mb-1.5 opacity-80">Perasaanku</h3>
                            <p class="text-gray-300 font-light leading-relaxed whitespace-pre-wrap">${entry.feelings}</p>
                        </div>
                        <div>
                            <h3 class="text-red-400 text-xs font-bold uppercase tracking-widest mb-1.5 opacity-80">Kesalahanku</h3>
                            <p class="text-gray-300 font-light leading-relaxed whitespace-pre-wrap">${entry.mistakes}</p>
                        </div>
                        <div>
                            <h3 class="text-neon-cyan text-xs font-bold uppercase tracking-widest mb-1.5 opacity-80">Pelajaranku</h3>
                            <p class="text-gray-300 font-light leading-relaxed whitespace-pre-wrap">${entry.lessons}</p>
                        </div>
                    </div>
                `;
                return card;
            };

            // Render semua saat awal load
            const renderJournals = () => {
                entriesContainer.innerHTML = '';
                if(journals.length === 0) {
                    entriesContainer.innerHTML = '<p class="text-center text-gray-600 italic text-sm mt-10">Belum ada catatan. Ruang ini menunggumu.</p>';
                    return;
                }
                
                // Urutkan dari yang terbaru (reverse)
                const reversedJournals = [...journals].reverse();
                reversedJournals.forEach(entry => {
                    entriesContainer.appendChild(createEntryHTML(entry));
                });
            };

            // Handle Submit Form
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                // Ambil value
                const feelingsVal = document.getElementById('feelings').value;
                const mistakesVal = document.getElementById('mistakes').value;
                const lessonsVal = document.getElementById('lessons').value;

                // Buat object
                const newEntry = {
                    id: Date.now(),
                    date: new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' }),
                    feelings: feelingsVal,
                    mistakes: mistakesVal,
                    lessons: lessonsVal
                };

                // Simpan ke DB lokal
                journals.push(newEntry);
                localStorage.setItem('syiraJournalsAesthetic', JSON.stringify(journals));

                // Hapus placeholder teks kosong kalau itu input pertama
                if (journals.length === 1) {
                    entriesContainer.innerHTML = '';
                }

                // Tambahkan elemen baru ke paling atas dengan animasi
                const newCard = createEntryHTML(newEntry, true);
                entriesContainer.insertBefore(newCard, entriesContainer.firstChild);

                // Clear form
                form.reset();
                
                // Fokus kembali ke field pertama biar smooth flow-nya
                document.getElementById('feelings').focus();
            });

            // Initial render
            renderJournals();
        });
    </script>
</body>
</html>
