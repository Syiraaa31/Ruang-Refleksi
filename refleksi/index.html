<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Refleksi | Syira</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#050b14', 800: '#0a1426', 700: '#112240' },
                        neon: { blue: '#4facfe', cyan: '#00f2fe' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050b14; }
        ::-webkit-scrollbar-thumb { background: #112240; border-radius: 10px; }
        
        /* Fix bug kursor nyangkut dengan pointer-events: none */
        .bg-glow {
            position: fixed; top: 50%; left: 50%; width: 100vw; height: 100vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 50% 50%, rgba(17, 34, 64, 0.5), rgba(5, 11, 20, 1) 70%);
            z-index: -2; pointer-events: none;
        }
        .ambient-light {
            position: fixed; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.05), transparent 70%);
            z-index: -1; animation: float 15s infinite ease-in-out alternate;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translate(-10%, -10%) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.2); }
        }

        .input-glow:focus {
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.4), inset 0 0 10px rgba(79, 172, 254, 0.1);
            border-color: #4facfe;
        }
        .entry-animate {
            animation: slideFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; transform: translateY(20px);
        }
        @keyframes slideFadeIn { to { opacity: 1; transform: translateY(0); } }
        .glass-panel {
            background: rgba(10, 20, 38, 0.6); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-navy-900 text-gray-300 font-sans antialiased min-h-screen relative overflow-x-hidden">

    <div class="bg-glow"></div>
    <div class="ambient-light" style="top: -10%; left: -10%;"></div>
    <div class="ambient-light" style="bottom: -10%; right: -10%; animation-delay: -5s;"></div>

    <div class="max-w-4xl mx-auto p-6 md:p-12 relative z-10">
        <header class="mb-12 text-center">
            <h1 class="text-4xl md:text-5xl font-serif text-white mb-3 tracking-wide">RUANG REFLEKSI</h1>
            <p class="text-gray-400 text-sm md:text-base font-light tracking-widest uppercase">Growth starts when you are honest with yourself</p>
        </header>

        <main class="glass-panel p-8 rounded-2xl shadow-2xl mb-16 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-neon-blue to-transparent opacity-30"></div>
            
            <form id="reflectionForm" class="space-y-8">
                
                <!-- MOOD SECTION DI DALAM FORM -->
                <div class="glass-panel p-6 rounded-xl border border-navy-700 text-center space-y-4">
                    <h2 class="text-lg font-serif text-white">Pilih Suasana Hati (Mood)</h2>
                    <p class="text-gray-400 text-xs">Bagikan kondisimu agar pasangan tahu apa yang sedang kamu rasakan.</p>
                    <div class="flex justify-center gap-3 flex-wrap pt-2">
                        <button type="button" onclick="setMood('Bahagia ☀️')" class="glass-panel px-4 py-2 rounded-lg hover:border-amber-400 transition-all text-sm">☀️ Bahagia</button>
                        <button type="button" onclick="setMood('Lelah 🌧️')" class="glass-panel px-4 py-2 rounded-lg hover:border-blue-400 transition-all text-sm">🌧️ Lelah</button>
                        <button type="button" onclick="setMood('Rindu 🌙')" class="glass-panel px-4 py-2 rounded-lg hover:border-purple-400 transition-all text-sm">🌙 Rindu</button>
                        <button type="button" onclick="setMood('Stres ⚡')" class="glass-panel px-4 py-2 rounded-lg hover:border-red-400 transition-all text-sm">⚡ Stres</button>
                    </div>
                    <div class="mt-4 p-3 rounded-lg bg-navy-800/80 text-sm text-gray-300">
                        Mood Terpilih: <span id="currentMoodText" class="text-neon-blue font-semibold">Belum dipilih</span>
                    </div>
                </div>

                <!-- TEXTAREAS -->
                <div>
                    <label class="flex items-center gap-2 text-sm font-semibold text-neon-blue mb-3 uppercase tracking-wider" for="feelings">Perasaanku Detail</label>
                    <textarea id="feelings" rows="2" required class="input-glow w-full bg-navy-800/80 border border-navy-700 rounded-xl p-4 text-gray-200 focus:outline-none transition-all duration-300 resize-none" placeholder="Ceritakan lebih detail perasaanmu..."></textarea>
                </div>
                <div>
                    <label class="flex items-center gap-2 text-sm font-semibold text-red-400 mb-3 uppercase tracking-wider" for="mistakes">Kesalahanku</label>
                    <textarea id="mistakes" rows="2" required class="input-glow w-full bg-navy-800/80 border border-navy-700 rounded-xl p-4 text-gray-200 focus:outline-none transition-all duration-300 resize-none" placeholder="Evaluasi objektif..."></textarea>
                </div>
                <div>
                    <label class="flex items-center gap-2 text-sm font-semibold text-neon-cyan mb-3 uppercase tracking-wider" for="lessons">Pelajaranku</label>
                    <textarea id="lessons" rows="2" required class="input-glow w-full bg-navy-800/80 border border-navy-700 rounded-xl p-4 text-gray-200 focus:outline-none transition-all duration-300 resize-none" placeholder="Resolusi konkrit..."></textarea>
                </div>

                <div class="text-center pt-6">
                    <button type="submit" id="submitBtn" class="group relative inline-flex items-center justify-center px-8 py-3 text-sm font-bold text-white uppercase tracking-widest transition-all duration-300 bg-gradient-to-r from-cyan-600 to-blue-600 rounded-full hover:from-cyan-500 hover:to-blue-500 overflow-hidden shadow-[0_0_20px_rgba(79,172,254,0.3)] hover:shadow-[0_0_30px_rgba(79,172,254,0.6)]">
                        <span class="absolute w-0 h-0 transition-all duration-500 ease-out bg-white rounded-full group-hover:w-56 group-hover:h-56 opacity-10"></span>
                        <span class="relative">Simpan Jurnal Hari Ini 🤗</span>
                    </button>
                </div>
            </form>
        </main>

        <section>
            <h2 class="text-center text-sm font-bold text-gray-400 uppercase tracking-[0.3em] mb-8 relative">
                <span class="bg-navy-900 px-4 relative z-10">Jejak Langkah (History)</span>
                <div class="absolute top-1/2 left-0 w-full h-[1px] bg-navy-700 -z-0"></div>
            </h2>
            <div id="journalEntries" class="space-y-6">
                <p class="text-center text-gray-600 italic text-sm mt-10">Memuat data dari cloud...</p>
            </div>
        </section>
    </div>

    <!-- FIREBASE REALTIME LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZAm_e2wp3RiIOoZAIKYzkjj4_tG6otzE",
            authDomain: "ruang-refleksi-33035.firebaseapp.com",
            projectId: "ruang-refleksi-33035",
            storageBucket: "ruang-refleksi-33035.firebasestorage.app",
            messagingSenderId: "156379297699",
            appId: "1:156379297699:web:6d8a206a31e678a5b00c16",
            measurementId: "G-00H3B5NXL4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const journalsRef = collection(db, "jurnal_refleksi");

        // Logic Mood Button
        let currentMood = "Netral";
        window.setMood = function(moodValue) {
            currentMood = moodValue;
            document.getElementById('currentMoodText').innerText = currentMood;
        };

        const form = document.getElementById('reflectionForm');
        const entriesContainer = document.getElementById('journalEntries');
        const submitBtn = document.getElementById('submitBtn');

        const createEntryHTML = (entry, animate = false) => {
            const card = document.createElement('div');
            card.className = `glass-panel p-6 md:p-8 rounded-2xl border-l-4 border-l-neon-blue hover:border-l-neon-cyan transition-colors duration-300 ${animate ? 'entry-animate' : ''}`;
            
            card.innerHTML = `
                <div class="flex justify-between items-center mb-5">
                    <div class="text-xs text-gray-500 font-mono tracking-wider">${entry.date}</div>
                    <div class="text-xs font-bold px-3 py-1 bg-navy-800 rounded-full border border-navy-700">${entry.mood || 'Netral'}</div>
                </div>
                <div class="space-y-5">
                    <div>
                        <h3 class="text-neon-blue text-xs font-bold uppercase tracking-widest mb-1.5 opacity-80">Perasaanku</h3>
                        <p class="text-gray-300 font-light leading-relaxed whitespace-pre-wrap">${entry.feelings}</p>
                    </div>
                    <div>
                        <h3 class="text-red-400 text-xs font-bold uppercase tracking-widest mb-1.5 opacity-80">Kesalahanku</h3>
                        <p class="text-gray-300 font-light leading-relaxed whitespace-pre-wrap">${entry.mistakes}</p>
                    </div>
                    <div>
                        <h3 class="text-neon-cyan text-xs font-bold uppercase tracking-widest mb-1.5 opacity-80">Pelajaranku</h3>
                        <p class="text-gray-300 font-light leading-relaxed whitespace-pre-wrap">${entry.lessons}</p>
                    </div>
                </div>
            `;
            return card;
        };

        // Real-time Listener Firestore
        const q = query(journalsRef, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            entriesContainer.innerHTML = ''; 
            if(snapshot.empty) {
                entriesContainer.innerHTML = '<p class="text-center text-gray-600 italic text-sm mt-10">Belum ada catatan di database.</p>';
                return;
            }
            snapshot.forEach((doc) => {
                const entry = doc.data();
                const isNew = (Date.now() - entry.timestamp) < 2000; 
                entriesContainer.appendChild(createEntryHTML(entry, isNew));
            });
        });

        // Simpan ke Firestore
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="relative">Menyimpan...</span>';

            try {
                await addDoc(journalsRef, {
                    date: new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' }),
                    mood: currentMood,
                    feelings: document.getElementById('feelings').value,
                    mistakes: document.getElementById('mistakes').value,
                    lessons: document.getElementById('lessons').value,
                    timestamp: Date.now()
                });
                
                form.reset();
                currentMood = "Netral";
                document.getElementById('currentMoodText').innerText = "Belum dipilih";
                if(typeof confetti === "function") confetti(); // Opsional efek confetti
                
            } catch (error) {
                console.error("Error: ", error);
                alert("Gagal nyimpen data ke Cloud.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="absolute w-0 h-0 transition-all duration-500 ease-out bg-white rounded-full group-hover:w-56 group-hover:h-56 opacity-10"></span><span class="relative">Simpan Jurnal Hari Ini 🤗</span>';
            }
        });
    </script>
</body>
</html>
